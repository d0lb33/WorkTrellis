name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test test/compose.integration.test.ts
        env:
          WORKTRELLIS_COMPOSE_TEST: "1"
      - run: pnpm test test/worktree-scopes.smoke.test.ts
        env:
          WORKTRELLIS_COMPOSE_TEST: "1"
      - run: pnpm build
      - name: Verify release tag matches package version
        run: node -e "const p=require('./package.json'); if (process.env.GITHUB_REF_NAME !== 'v' + p.version) throw new Error('Release tag must be v' + p.version)"
      - name: Select npm dist-tag
        id: npm-tag
        env:
          GITHUB_RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: >-
          node -e "const fs=require('node:fs'); const p=require('./package.json');
          const prerelease=p.version.includes('-'); const
          releasePrerelease=process.env.GITHUB_RELEASE_PRERELEASE==='true'; if
          (prerelease !== releasePrerelease) throw new Error(prerelease ?
          'Prerelease package versions require a GitHub prerelease' : 'Stable
          package versions require a non-prerelease GitHub release');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'tag=' + (prerelease ?
          'beta' : 'latest') + '\n')"
      - run: npm install --global "npm@^11.5.1"
      - run: npm publish --tag "${{ steps.npm-tag.outputs.tag }}"
