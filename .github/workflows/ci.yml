name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node bin/worktrellis.mjs --version
      - run: node bin/worktrellis.mjs info --config examples/basic/worktrellis.config.ts --json
      - run: npm pack --dry-run

  compose-integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test test/compose.integration.test.ts
        env:
          WORKTRELLIS_COMPOSE_TEST: "1"
      - run: pnpm test test/worktree-scopes.smoke.test.ts
        env:
          WORKTRELLIS_COMPOSE_TEST: "1"
